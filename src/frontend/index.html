<div class="scanline-overlay" id="scanline-overlay"></div>

<!-- ═══════════════════════════════════════════════════════════════
     JAVASCRIPT — Application Logic
     ═══════════════════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════════════════
   APPLICATION STATE
   ═══════════════════════════════════════════════════════════════ */
const State = {
  repos: [],
  repoStates: [],       // Array of { repo, workflows, active_runs, recent_runs }
  rateLimit: { limit: 0, remaining: 0, used: 0, reset: null },
  lastPoll: null,
  activeTab: 'active-runs',
  expandedRuns: {},      // { runId: { jobs: [...], loading: bool } }
  expandedJobs: {},      // { jobId: true }
  ws: null,
  wsReconnectTimer: null,
  wsReconnectDelay: 1000,
  wsMaxReconnectDelay: 30000,
  wsConnected: false,
  durationTimers: new Map(),  // runId -> intervalId
  sidebarCollapsed: false,
  dispatchContext: null,  // { repo, workflowId, workflowName }
  initialLoadDone: false,
  workflowSearchQuery: '',
};

/* ═══════════════════════════════════════════════════════════════
   UTILITY FUNCTIONS
   ═══════════════════════════════════════════════════════════════ */

/** Escape HTML to prevent XSS */
function esc(str) {
  if (str == null) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

/** Format a duration in seconds to human-readable */
function formatDuration(seconds) {
  if (seconds == null || seconds < 0) return '--';
  const s = Math.floor(seconds);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  const rem = s % 60;
  if (m < 60) return m + 'm ' + rem + 's';
  const h = Math.floor(m / 60);
  const remM = m % 60;
  return h + 'h ' + remM + 'm';
}

/** Calculate elapsed seconds from a date string to now */
function elapsedSince(dateStr) {
  if (!dateStr) return null;
  const start = new Date(dateStr).getTime();
  const now = Date.now();
  return Math.max(0, Math.floor((now - start) / 1000));
}

/** Format a date string to a short local string */
function formatTime(dateStr) {
  if (!dateStr) return '--';
  const d = new Date(dateStr);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) {
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
    ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

/** Format relative time ago */
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const seconds = elapsedSince(dateStr);
  if (seconds == null) return '';
  if (seconds < 60) return 'just now';
  const m = Math.floor(seconds / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  return d + 'd ago';
}

/** Get status icon */
function statusIcon(status, conclusion) {
  if (status === 'queued') return '<span style="color:var(--status-queued)">&#9679;</span>';
  if (status === 'in_progress') return '<span style="color:var(--status-in-progress)">&#9679;</span>';
  if (status === 'completed') {
    if (conclusion === 'success') return '<span style="color:var(--status-success)">&#10003;</span>';
    if (conclusion === 'failure') return '<span style="color:var(--status-failure)">&#10007;</span>';
    if (conclusion === 'cancelled') return '<span style="color:var(--status-cancelled)">&#9632;</span>';
    return '<span style="color:var(--text-muted)">&#9679;</span>';
  }
  return '<span style="color:var(--text-muted)">&#9679;</span>';
}

/** Get step conclusion icon */
function stepIcon(conclusion) {
  if (conclusion === 'success') return '<span class="step-icon" style="color:var(--status-success)">&#10003;</span>';
  if (conclusion === 'failure') return '<span class="step-icon" style="color:var(--status-failure)">&#10007;</span>';
  if (conclusion === 'skipped') return '<span class="step-icon" style="color:var(--text-muted)">&#8722;</span>';
  return '<span class="step-icon" style="color:var(--status-in-progress)">&#9679;</span>';
}

/** Get status badge HTML */
function statusBadge(status, conclusion) {
  let label = status || 'unknown';
  let cls = status || 'unknown';
  if (status === 'completed') {
    label = conclusion || 'completed';
    cls = conclusion || 'completed';
  }
  return '<span class="status-badge ' + esc(cls) + '">' + statusIcon(status, conclusion) + ' ' + esc(label) + '</span>';
}

/** Calculate run duration */
function runDuration(run) {
  const startAt = run.run_started_at || run.created_at;
  if (!startAt) return null;
  const start = new Date(startAt).getTime();
  if (run.status === 'completed') {
    const end = new Date(run.updated_at).getTime();
    return Math.max(0, Math.floor((end - start) / 1000));
  }
  // In progress — calculate from now
  return Math.max(0, Math.floor((Date.now() - start) / 1000));
}

/** Validate owner/repo format */
function validateRepoFormat(str) {
  const trimmed = (str || '').trim();
  if (!trimmed) return null;
  const parts = trimmed.split('/');
  if (parts.length !== 2) return null;
  const owner = parts[0].trim();
  const repo = parts[1].trim();
  if (!owner || !repo) return null;
  if (!/^[a-zA-Z0-9._-]+$/.test(owner)) return null;
  if (!/^[a-zA-Z0-9._-]+$/.test(repo)) return null;
  return owner + '/' + repo;
}

/** Simple API fetch wrapper */
async function apiFetch(path, options) {
  const opts = Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {});
  const res = await fetch(path, opts);
  if (!res.ok) {
    let errorMsg = 'Request failed: ' + res.status;
    try {
      const body = await res.json();
      if (body.error) errorMsg = body.error;
      else if (body.message) errorMsg = body.message;
    } catch (_) {}
    throw new Error(errorMsg);
  }
  // Some endpoints return 204 No Content
  if (res.status === 204) return {};
  return res.json();
}

/* ═══════════════════════════════════════════════════════════════
   WEBSOCKET CONNECTION
   ═══════════════════════════════════════════════════════════════ */

function wsConnect() {
  if (State.ws && (State.ws.readyState === WebSocket.CONNECTING || State.ws.readyState === WebSocket.OPEN)) {
    return;
  }

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = protocol + '//' + location.host + '/ws/live';

  updateWsStatus('connecting');

  try {
    State.ws = new WebSocket(url);
  } catch (e) {
    console.error('WebSocket creation failed:', e);
    wsScheduleReconnect();
    return;
  }

  State.ws.onopen = function() {
    State.wsConnected = true;
    State.wsReconnectDelay = 1000;
    updateWsStatus('connected');
    console.log('[WS] Connected');
  };

  State.ws.onmessage = function(evt) {
    try {
      const msg = JSON.parse(evt.data);
      handleWsMessage(msg);
    } catch (e) {
      console.error('[WS] Parse error:', e);
    }
  };

  State.ws.onclose = function(evt) {
    State.wsConnected = false;
    updateWsStatus('disconnected');
    console.log('[WS] Closed:', evt.code, evt.reason);
    wsScheduleReconnect();
  };

  State.ws.onerror = function(err) {
    console.error('[WS] Error:', err);
  };
}

function wsScheduleReconnect() {
  if (State.wsReconnectTimer) return;
  const delay = State.wsReconnectDelay;
  console.log('[WS] Reconnecting in ' + delay + 'ms');
  updateWsStatus('connecting');
  State.wsReconnectTimer = setTimeout(function() {
    State.wsReconnectTimer = null;
    // Exponential backoff
    State.wsReconnectDelay = Math.min(State.wsReconnectDelay * 2, State.wsMaxReconnectDelay);
    wsConnect();
  }, delay);
}

function updateWsStatus(status) {
  const dot = document.getElementById('ws-dot');
  const text = document.getElementById('ws-status-text');
  dot.className = 'ws-dot';
  if (status === 'connected') {
    dot.classList.add('connected');
    text.textContent = 'live';
  } else if (status === 'connecting') {
    dot.classList.add('connecting');
    text.textContent = 'connecting';
  } else {
    text.textContent = 'disconnected';
  }
}

/* ═══════════════════════════════════════════════════════════════
   WEBSOCKET MESSAGE HANDLERS
   ═══════════════════════════════════════════════════════════════ */

function handleWsMessage(msg) {
  switch (msg.type) {
    case 'state':
      handleStateUpdate(msg.data);
      break;
    case 'run_update':
      handleRunUpdate(msg.repo, msg.run);
      break;
    case 'rate_limit':
      handleRateLimitUpdate(msg.data);
      break;
    case 'repos_changed':
      handleReposChanged(msg.repos);
      break;
    default:
      console.log('[WS] Unknown message type:', msg.type);
  }
}

function handleStateUpdate(data) {
  State.repoStates = data.repos || [];
  State.repos = State.repoStates.map(function(r) { return r.repo; });
  State.rateLimit = data.rate_limit || State.rateLimit;
  State.lastPoll = data.last_poll;
  State.initialLoadDone = true;

  renderAll();
}

function handleRunUpdate(repo, run) {
  // Ensure repo field is set on the run
  run.repo = run.repo || repo;

  // Find the repo state
  const repoState = State.repoStates.find(function(r) { return r.repo === repo; });
  if (!repoState) return;

  const isActive = run.status === 'in_progress' || run.status === 'queued';

  // Update active runs
  const activeIdx = repoState.active_runs.findIndex(function(r) { return r.id === run.id; });
  if (isActive) {
    if (activeIdx >= 0) {
      repoState.active_runs[activeIdx] = run;
    } else {
      repoState.active_runs.push(run);
    }
  } else {
    if (activeIdx >= 0) {
      repoState.active_runs.splice(activeIdx, 1);
    }
  }

  // Update recent runs
  if (run.status === 'completed') {
    const recentIdx = repoState.recent_runs.findIndex(function(r) { return r.id === run.id; });
    if (recentIdx >= 0) {
      repoState.recent_runs[recentIdx] = run;
    } else {
      repoState.recent_runs.unshift(run);
      // Keep only last 20
      if (repoState.recent_runs.length > 20) {
        repoState.recent_runs.pop();
      }
    }
  }

  renderAll();
}

function handleRateLimitUpdate(data) {
  State.rateLimit = data;
  renderRateLimit();
}

function handleReposChanged(repos) {
  State.repos = repos;
  // Remove states for repos no longer tracked
  State.repoStates = State.repoStates.filter(function(r) {
    return repos.indexOf(r.repo) >= 0;
  });
  renderSidebar();
  renderActiveRuns();
  renderWorkflows();
  renderActions();
  renderHistory();
}

/* ═══════════════════════════════════════════════════════════════
   RENDER FUNCTIONS
   ═══════════════════════════════════════════════════════════════ */

function renderAll() {
  renderRateLimit();
  renderLastPoll();
  renderSidebar();
  renderActiveRuns();
  renderWorkflows();
  renderActions();
  renderHistory();
}

/** Rate Limit Badge */
function renderRateLimit() {
  const badge = document.getElementById('rate-limit-badge');
  const text = document.getElementById('rate-limit-text');
  const rl = State.rateLimit;

  if (!rl || !rl.limit) {
    text.textContent = '--/--';
    badge.className = 'rate-limit-badge';
    return;
  }

  text.textContent = rl.remaining + '/' + rl.limit;
  const pct = rl.remaining / rl.limit;
  badge.className = 'rate-limit-badge';
  if (pct > 0.8) {
    badge.classList.add('rate-green');
  } else if (pct > 0.2) {
    badge.classList.add('rate-yellow');
  } else {
    badge.classList.add('rate-red');
  }
}

/** Last Poll Time */
function renderLastPoll() {
  const el = document.getElementById('last-poll-text');
  if (State.lastPoll) {
    el.textContent = 'Updated ' + timeAgo(State.lastPoll);
  } else {
    el.textContent = '';
  }
}

/** Sidebar Repos */
function renderSidebar() {
  const container = document.getElementById('repo-list');
  const countEl = document.getElementById('repo-count');

  countEl.textContent = State.repos.length;

  if (State.repos.length === 0) {
    container.innerHTML = '<div style="padding:20px 16px;color:var(--text-muted);font-size:var(--font-size-xs);text-align:center;">No repos monitored.<br>Add one below.</div>';
    return;
  }

  let html = '';
  State.repos.forEach(function(repoName) {
    const repoState = State.repoStates.find(function(r) { return r.repo === repoName; });
    const activeCount = repoState ? repoState.active_runs.length : 0;
    const hasActive = activeCount > 0;
    const dotClass = hasActive ? 'has-active' : 'idle';

    html += '<div class="repo-item" data-repo="' + esc(repoName) + '">';
    html += '  <div class="repo-item-left">';
    html += '    <span class="repo-dot ' + dotClass + '"></span>';
    html += '    <span class="repo-name" title="' + esc(repoName) + '">' + esc(repoName) + '</span>';
    if (hasActive) {
      html += '    <span class="repo-active-count">' + activeCount + '</span>';
    }
    html += '  </div>';
    html += '  <button class="repo-remove-btn" onclick="App.removeRepo(\'' + esc(repoName) + '\')" title="Remove">&times;</button>';
    html += '</div>';
  });

  container.innerHTML = html;
}

/** Active Runs Tab */
function renderActiveRuns() {
  const container = document.getElementById('active-runs-content');

  if (!State.initialLoadDone) {
    return; // Keep showing loading
  }

  // Collect all active runs grouped by repo
  let totalActive = 0;
  const groups = [];

  State.repoStates.forEach(function(repoState) {
    if (repoState.active_runs && repoState.active_runs.length > 0) {
      groups.push({
        repo: repoState.repo,
        runs: repoState.active_runs
      });
      totalActive += repoState.active_runs.length;
    }
  });

  // Update badge
  const badge = document.getElementById('active-count-badge');
  if (totalActive > 0) {
    badge.textContent = totalActive;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }

  if (groups.length === 0) {
    container.innerHTML = '<div class="empty-state">' +
      '<div class="empty-state-icon">&#9656;</div>' +
      '<div class="empty-state-title">No active runs</div>' +
      '<div class="empty-state-text">All workflows are idle. Active and queued runs will appear here automatically.</div>' +
      '</div>';
    stopAllDurationTimers();
    return;
  }

  let html = '';
  groups.forEach(function(group) {
    html += '<div class="run-group">';
    html += '  <div class="run-group-header">';
    html += '    <span class="run-group-repo">' + esc(group.repo) + '</span>';
    html += '    <span class="run-group-count">' + group.runs.length + ' active</span>';
    html += '  </div>';
    html += '  <div class="run-cards">';

    group.runs.forEach(function(run) {
      html += renderRunCard(run);
    });

    html += '  </div>';
    html += '</div>';
  });

  container.innerHTML = html;

  // Start duration timers for in-progress runs
  startDurationTimers();
}

function renderRunCard(run) {
  const status = run.status || 'unknown';
  const conclusion = run.conclusion || '';
  const name = run.name || run.display_title || 'Workflow #' + run.workflow_id;
  const title = run.display_title || '';
  const branch = run.head_branch || '--';
  const sha = (run.head_sha || '').substring(0, 7);
  const event = run.event || '--';
  const actor = run.actor;
  const actorLogin = actor ? actor.login : '--';
  const avatarUrl = actor && actor.avatar_url ? actor.avatar_url + '&s=32' : '';
  const isExpanded = !!State.expandedRuns[run.id];
  const duration = runDuration(run);
  const isActive = status === 'in_progress' || status === 'queued';

  let cardClasses = 'run-card status-' + status;
  if (conclusion) cardClasses += ' conclusion-' + conclusion;

  let html = '<div class="' + cardClasses + '" data-run-id="' + run.id + '">';

  // Top row: name + status badge
  html += '<div class="run-card-top">';
  html += '  <div class="run-card-info">';
  html += '    <div class="run-card-name" title="' + esc(name) + '">' + esc(name) + '</div>';
  if (title && title !== name) {
    html += '    <div class="run-card-title" title="' + esc(title) + '">' + esc(title) + '</div>';
  }
  html += '  </div>';
  html += '  <div class="run-card-badges">' + statusBadge(status, conclusion) + '</div>';
  html += '</div>';

  // Meta row
  html += '<div class="run-card-meta">';

  // Branch
  html += '<span class="run-meta-item"><span class="meta-icon">&#9741;</span> ' + esc(branch) + '</span>';

  // Event
  html += '<span class="run-meta-item"><span class="meta-icon">&#9889;</span> ' + esc(event) + '</span>';

  // SHA
  if (sha) {
    html += '<span class="run-meta-item"><span class="meta-icon">#</span> ' + esc(sha) + '</span>';
  }

  // Duration
  html += '<span class="run-meta-item duration-display" data-run-id="' + run.id + '">';
  html += '<span class="meta-icon">&#9201;</span> ' + formatDuration(duration);
  html += '</span>';

  // Actor
  html += '<span class="run-card-actor">';
  if (avatarUrl) {
    html += '<img class="actor-avatar" src="' + esc(avatarUrl) + '" alt="" loading="lazy">';
  }
  html += esc(actorLogin);
  html += '</span>';

  // Run number
  html += '<span class="run-meta-item">#' + run.run_number + '</span>';

  html += '</div>';

  // Action buttons
  html += '<div class="run-card-actions">';
  html += '  <button class="run-action-btn" onclick="App.toggleRunDetail(' + run.id + ', \'' + esc(run.repo) + '\', event)">' + (isExpanded ? 'Collapse' : 'Details') + '</button>';
  if (isActive) {
    html += '  <button class="run-action-btn cancel-btn" onclick="App.cancelRun(' + run.id + ', \'' + esc(run.repo) + '\', event)">Cancel</button>';
  }
  html += '  <button class="run-action-btn rerun-btn" onclick="App.rerunRun(' + run.id + ', \'' + esc(run.repo) + '\', event)">Re-run</button>';
  html += '  <a class="run-action-btn github-btn" href="' + esc(run.html_url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">GitHub &#8599;</a>';
  html += '</div>';

  // Expanded detail
  if (isExpanded) {
    html += renderRunDetail(run.id);
  }

  html += '</div>';
  return html;
}

function renderRunDetail(runId) {
  const info = State.expandedRuns[runId];
  if (!info) return '';

  let html = '<div class="run-detail">';

  if (info.loading) {
    html += '<div class="run-detail-loading"><span class="spinner"></span> Loading jobs...</div>';
  } else if (info.error) {
    html += '<div class="run-detail-loading" style="color:var(--accent-red)">Error: ' + esc(info.error) + '</div>';
  } else if (!info.jobs || info.jobs.length === 0) {
    html += '<div class="run-detail-loading">No jobs found</div>';
  } else {
    info.jobs.forEach(function(job) {
      const isJobExpanded = !!State.expandedJobs[job.id];
      const jobDuration = jobDurationCalc(job);
      html += '<div class="job-item">';
      html += '  <div class="job-header" onclick="App.toggleJob(' + job.id + ', ' + runId + ')">';
      html += '    <div class="job-header-left">';
      html += '      ' + statusIcon(job.status, job.conclusion);
      html += '      <span class="job-name">' + esc(job.name) + '</span>';
      html += '    </div>';
      html += '    <div class="job-header-right">';
      if (job.runner_name) {
        html += '      <span>' + esc(job.runner_name) + '</span>';
      }
      html += '      <span>' + formatDuration(jobDuration) + '</span>';
      html += '      <span>' + (isJobExpanded ? '&#9660;' : '&#9654;') + '</span>';
      html += '    </div>';
      html += '  </div>';

      // Steps
      if (isJobExpanded && job.steps && job.steps.length > 0) {
        html += '  <div class="job-steps expanded">';
        job.steps.forEach(function(step) {
          const stepDur = stepDurationCalc(step);
          html += '<div class="step-item">';
          html += stepIcon(step.conclusion);
          html += '<span class="step-name" title="' + esc(step.name) + '">' + esc(step.name) + '</span>';
          html += '<span class="step-duration">' + formatDuration(stepDur) + '</span>';
          html += '</div>';
        });
        html += '  </div>';
      }

      html += '</div>';
    });
  }

  html += '</div>';
  return html;
}

function jobDurationCalc(job) {
  if (!job.started_at) return null;
  const start = new Date(job.started_at).getTime();
  if (job.completed_at) {
    return Math.max(0, Math.floor((new Date(job.completed_at).getTime() - start) / 1000));
  }
  return Math.max(0, Math.floor((Date.now() - start) / 1000));
}

function stepDurationCalc(step) {
  if (!step.started_at) return null;
  const start = new Date(step.started_at).getTime();
  if (step.completed_at) {
    return Math.max(0, Math.floor((new Date(step.completed_at).getTime() - start) / 1000));
  }
  return Math.max(0, Math.floor((Date.now() - start) / 1000));
}

/** Workflows Tab */
function renderWorkflows() {
  const container = document.getElementById('workflows-content');
  const query = State.workflowSearchQuery.toLowerCase();

  // Collect all workflows grouped by repo
  const allGroups = [];
  State.repoStates.forEach(function(repoState) {
    if (!repoState.workflows || repoState.workflows.length === 0) return;
    const filtered = repoState.workflows.filter(function(wf) {
      if (!query) return true;
      return (wf.name || '').toLowerCase().indexOf(query) >= 0 ||
             (wf.path || '').toLowerCase().indexOf(query) >= 0;
    });
    if (filtered.length > 0) {
      allGroups.push({ repo: repoState.repo, workflows: filtered });
    }
  });

  if (!State.initialLoadDone) return;

  if (allGroups.length === 0) {
    container.innerHTML = '<div class="empty-state">' +
      '<div class="empty-state-icon">&#9881;</div>' +
      '<div class="empty-state-title">No workflows found</div>' +
      '<div class="empty-state-text">' + (query ? 'No workflows match your search.' : 'Add repositories to see their workflows.') + '</div>' +
      '</div>';
    return;
  }

  let html = '<div class="workflow-table-wrap"><table class="workflow-table">';
  html += '<thead><tr>';
  html += '<th>Workflow</th><th>File</th><th>State</th><th>Repo</th><th></th>';
  html += '</tr></thead><tbody>';

  allGroups.forEach(function(group) {
    html += '<tr class="workflow-group-header"><td colspan="5">' + esc(group.repo) + ' (' + group.workflows.length + ')</td></tr>';
    group.workflows.forEach(function(wf) {
      const stateClass = (wf.state || '').replace(/ /g, '_').toLowerCase();
      html += '<tr>';
      html += '<td class="wf-name">' + esc(wf.name) + '</td>';
      html += '<td class="wf-path">' + esc(wf.path) + '</td>';
      html += '<td><span class="wf-state ' + esc(stateClass) + '">' + esc(wf.state) + '</span></td>';
      html += '<td class="wf-repo">' + esc(group.repo) + '</td>';
      html += '<td><button class="trigger-btn" onclick="App.openDispatchModal(\'' + esc(group.repo) + '\', ' + wf.id + ', \'' + esc(wf.name.replace(/'/g, "\\'")) + '\')">&#9654; Trigger</button></td>';
      html += '</tr>';
    });
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

/** Actions Tab — unified view for triggering and monitoring workflow runs */
function renderActions() {
  var container = document.getElementById('actions-content');

  if (!State.initialLoadDone) return;

  // Build a list of all workflows with their latest run
  var allActions = [];
  State.repoStates.forEach(function(repoState) {
    if (!repoState.workflows || repoState.workflows.length === 0) return;
    repoState.workflows.forEach(function(wf) {
      // Find latest run for this workflow
      var latestRun = null;
      var allRuns = (repoState.active_runs || []).concat(repoState.recent_runs || []);
      allRuns.forEach(function(run) {
        if (run.workflow_id === wf.id) {
          if (!latestRun || new Date(run.updated_at) > new Date(latestRun.updated_at)) {
            latestRun = run;
          }
        }
      });
      allActions.push({ workflow: wf, repo: repoState.repo, latestRun: latestRun });
    });
  });

  if (allActions.length === 0) {
    container.innerHTML = '<div class="empty-state">' +
      '<div class="empty-state-icon">&#9654;</div>' +
      '<div class="empty-state-title">No actions available</div>' +
      '<div class="empty-state-text">Add repositories to see their GitHub Actions workflows here.</div>' +
      '</div>';
    return;
  }

  // Group by repo
  var groups = {};
  allActions.forEach(function(a) {
    if (!groups[a.repo]) groups[a.repo] = [];
    groups[a.repo].push(a);
  });

  var html = '';
  Object.keys(groups).forEach(function(repo) {
    html += '<div class="action-group-header">' + esc(repo) + ' (' + groups[repo].length + ' workflows)</div>';
    html += '<div class="actions-grid">';

    groups[repo].forEach(function(item) {
      var wf = item.workflow;
      var run = item.latestRun;
      var stateClass = (wf.state || '').replace(/ /g, '_').toLowerCase();

      html += '<div class="action-card">';

      // Top: name + state badge
      html += '<div class="action-card-top">';
      html += '  <div class="action-card-info">';
      html += '    <div class="action-card-name" title="' + esc(wf.name) + '">' + esc(wf.name) + '</div>';
      html += '    <div class="action-card-path" title="' + esc(wf.path) + '">' + esc(wf.path) + '</div>';
      html += '  </div>';
      html += '  <span class="action-card-state ' + esc(stateClass) + '">' + esc(wf.state) + '</span>';
      html += '</div>';

      // Latest run info
      if (run) {
        var runStatus = run.status || 'unknown';
        var runConclusion = run.conclusion || '';
        var runName = run.display_title || run.name || '';
        var runBranch = run.head_branch || '';
        var runTime = timeAgo(run.updated_at);

        html += '<div class="action-card-latest">';
        html += '  <span class="action-card-latest-label">Latest:</span>';
        html += '  <div class="action-card-latest-info">';
        html += '    ' + statusIcon(runStatus, runConclusion);
        if (runName) {
          html += '    <span class="action-card-latest-name" title="' + esc(runName) + '">' + esc(runName) + '</span>';
        }
        if (runBranch) {
          html += '    <span class="action-card-latest-branch">' + esc(runBranch) + '</span>';
        }
        html += '  </div>';
        html += '  <span class="action-card-latest-time">' + esc(runTime) + '</span>';
        html += '</div>';
      } else {
        html += '<div class="action-card-latest">';
        html += '  <span class="action-card-latest-label" style="color:var(--text-muted)">No runs yet</span>';
        html += '</div>';
      }

      // Action buttons
      html += '<div class="action-card-actions">';
      html += '  <button class="action-run-btn" onclick="App.quickRunAction(\'' + esc(item.repo) + '\', ' + wf.id + ', \'' + esc(wf.name.replace(/'/g, "\\'")) + '\')">&#9654; Run</button>';
      html += '  <button class="action-trigger-btn" onclick="App.openDispatchModal(\'' + esc(item.repo) + '\', ' + wf.id + ', \'' + esc(wf.name.replace(/'/g, "\\'")) + '\')">&#9881; Configure &amp; Run</button>';
      // GitHub link
      var ghUrl = 'https://github.com/' + item.repo + '/actions/workflows/' + (wf.path || '').replace(/^\.github\/workflows\//, '');
      html += '  <a class="action-github-link" href="' + esc(ghUrl) + '" target="_blank" rel="noopener">GitHub &#8599;</a>';
      html += '</div>';

      html += '</div>';
    });

    html += '</div>';
  });

  container.innerHTML = html;
}

/** History Tab */
function renderHistory() {
  const container = document.getElementById('history-content');

  if (!State.initialLoadDone) return;

  // Collect all recent completed runs, sort by updated_at desc
  let allRecent = [];
  State.repoStates.forEach(function(repoState) {
    if (repoState.recent_runs) {
      repoState.recent_runs.forEach(function(run) {
        const r = Object.assign({}, run);
        r.repo = r.repo || repoState.repo;
        allRecent.push(r);
      });
    }
  });

  allRecent.sort(function(a, b) {
    return new Date(b.updated_at).getTime() - new Date(a.updated_at).getTime();
  });

  if (allRecent.length === 0) {
    container.innerHTML = '<div class="empty-state">' +
      '<div class="empty-state-icon">&#9716;</div>' +
      '<div class="empty-state-title">No recent runs</div>' +
      '<div class="empty-state-text">Completed workflow runs will appear here.</div>' +
      '</div>';
    return;
  }

  let html = '<table class="history-table">';
  html += '<thead><tr>';
  html += '<th></th><th>Workflow</th><th>Branch</th><th>Event</th><th>Actor</th><th>Duration</th><th>Completed</th><th>Repo</th>';
  html += '</tr></thead><tbody>';

  allRecent.forEach(function(run) {
    const conclusion = run.conclusion || '';
    const name = run.name || run.display_title || 'Workflow';
    const branch = run.head_branch || '--';
    const actor = run.actor;
    const actorLogin = actor ? actor.login : '--';
    const avatarUrl = actor && actor.avatar_url ? actor.avatar_url + '&s=20' : '';
    const dur = runDuration(run);

    html += '<tr class="conclusion-' + esc(conclusion) + ' history-clickable" onclick="window.open(\'' + esc(run.html_url) + '\', \'_blank\')">';
    html += '<td>' + statusIcon('completed', conclusion) + '</td>';
    html += '<td>' + esc(name) + '</td>';
    html += '<td>' + esc(branch) + '</td>';
    html += '<td>' + esc(run.event) + '</td>';
    html += '<td><span class="history-actor">';
    if (avatarUrl) {
      html += '<img class="actor-avatar" src="' + esc(avatarUrl) + '" alt="" loading="lazy">';
    }
    html += esc(actorLogin) + '</span></td>';
    html += '<td>' + formatDuration(dur) + '</td>';
    html += '<td title="' + esc(run.updated_at) + '">' + formatTime(run.updated_at) + '</td>';
    html += '<td class="history-repo">' + esc(run.repo) + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════
   DURATION TIMERS (live ticking for in-progress runs)
   ═══════════════════════════════════════════════════════════════ */

function stopAllDurationTimers() {
  State.durationTimers.forEach(function(id) {
    clearInterval(id);
  });
  State.durationTimers.clear();
}

function startDurationTimers() {
  stopAllDurationTimers();

  // Find all in-progress runs and start an interval for each
  State.repoStates.forEach(function(repoState) {
    if (!repoState.active_runs) return;
    repoState.active_runs.forEach(function(run) {
      if (run.status !== 'in_progress') return;
      const startAt = run.run_started_at || run.created_at;
      if (!startAt) return;

      const runId = run.id;
      const timerId = setInterval(function() {
        const el = document.querySelector('.duration-display[data-run-id="' + runId + '"]');
        if (!el) {
          clearInterval(timerId);
          State.durationTimers.delete(runId);
          return;
        }
        const elapsed = elapsedSince(startAt);
        el.innerHTML = '<span class="meta-icon">&#9201;</span> ' + formatDuration(elapsed);
      }, 1000);

      State.durationTimers.set(runId, timerId);
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   APPLICATION ACTIONS (App namespace)
   ═══════════════════════════════════════════════════════════════ */

const App = {

  /** Switch active tab */
  switchTab: function(tabId) {
    State.activeTab = tabId;
    try { localStorage.setItem('gwd_tab', tabId); } catch(_) {}

    // Update tab buttons
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.tab === tabId);
    });

    // Update panels
    document.querySelectorAll('.tab-panel').forEach(function(panel) {
      panel.classList.toggle('active', panel.id === 'panel-' + tabId);
    });
  },

  /** Toggle sidebar */
  toggleSidebar: function() {
    State.sidebarCollapsed = !State.sidebarCollapsed;
    document.getElementById('sidebar').classList.toggle('collapsed', State.sidebarCollapsed);
  },

  /** Add a repository */
  addRepo: async function(e) {
    e.preventDefault();
    const input = document.getElementById('add-repo-input');
    const btn = document.getElementById('add-repo-btn');
    const raw = input.value.trim();

    const validated = validateRepoFormat(raw);
    if (!validated) {
      App.showToast('Invalid format. Use owner/repo', 'error');
      input.focus();
      return;
    }

    // Check duplicate
    if (State.repos.indexOf(validated) >= 0) {
      App.showToast(validated + ' is already monitored', 'info');
      input.value = '';
      return;
    }

    btn.disabled = true;
    try {
      await apiFetch('/api/repos', {
        method: 'POST',
        body: JSON.stringify({ repos: [validated] })
      });
      input.value = '';
      App.showToast('Added ' + validated, 'success');
    } catch (err) {
      App.showToast('Failed to add: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  },

  /** Remove a repository */
  removeRepo: async function(repoName) {
    try {
      await apiFetch('/api/repos', {
        method: 'DELETE',
        body: JSON.stringify({ repos: [repoName] })
      });
      App.showToast('Removed ' + repoName, 'success');
    } catch (err) {
      App.showToast('Failed to remove: ' + err.message, 'error');
    }
  },

  /** Toggle run detail expansion */
  toggleRunDetail: async function(runId, repo, event) {
    if (event) event.stopPropagation();

    if (State.expandedRuns[runId]) {
      delete State.expandedRuns[runId];
      renderActiveRuns();
      return;
    }

    // Start loading
    State.expandedRuns[runId] = { loading: true, jobs: [], error: null };
    renderActiveRuns();

    const parts = repo.split('/');
    const owner = parts[0];
    const repoName = parts[1];

    try {
      const data = await apiFetch('/api/runs/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repoName) + '/' + runId);
      State.expandedRuns[runId] = { loading: false, jobs: data.jobs || [], error: null };
    } catch (err) {
      State.expandedRuns[runId] = { loading: false, jobs: [], error: err.message };
    }

    renderActiveRuns();
  },

  /** Toggle job steps expansion */
  toggleJob: function(jobId, runId) {
    if (State.expandedJobs[jobId]) {
      delete State.expandedJobs[jobId];
    } else {
      State.expandedJobs[jobId] = true;
    }
    renderActiveRuns();
  },

  /** Cancel a run */
  cancelRun: async function(runId, repo, event) {
    if (event) event.stopPropagation();
    const parts = repo.split('/');
    const owner = parts[0];
    const repoName = parts[1];

    try {
      const data = await apiFetch('/api/runs/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repoName) + '/' + runId + '/cancel', { method: 'POST' });
      App.showToast(data.message || 'Run cancelled', 'success');
    } catch (err) {
      App.showToast('Cancel failed: ' + err.message, 'error');
    }
  },

  /** Re-run a workflow */
  rerunRun: async function(runId, repo, event) {
    if (event) event.stopPropagation();
    const parts = repo.split('/');
    const owner = parts[0];
    const repoName = parts[1];

    try {
      const data = await apiFetch('/api/runs/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repoName) + '/' + runId + '/rerun', { method: 'POST' });
      App.showToast(data.message || 'Workflow re-triggered', 'success');
    } catch (err) {
      App.showToast('Re-run failed: ' + err.message, 'error');
    }
  },

  /** Filter workflows by search query */
  filterWorkflows: function() {
    State.workflowSearchQuery = document.getElementById('workflow-search-input').value;
    renderWorkflows();
  },

  /** Quick-run a workflow on its default branch (main or master).
   *  If workflow has required inputs, opens the full modal instead. */
  quickRunAction: async function(repo, workflowId, workflowName) {
    var parts = repo.split('/');

    // Check for required inputs first
    try {
      var inputsData = await apiFetch('/api/workflows/' + encodeURIComponent(parts[0]) + '/' + encodeURIComponent(parts[1]) + '/' + workflowId + '/inputs');
      if (inputsData && !inputsData.has_dispatch) {
        App.showToast('This workflow has no workflow_dispatch trigger', 'error');
        return;
      }
      // If there are required inputs, open the full modal
      if (inputsData && inputsData.inputs) {
        var hasRequired = inputsData.inputs.some(function(inp) { return inp.required; });
        if (hasRequired || inputsData.inputs.length > 0) {
          App.showToast('This workflow has inputs — opening configure dialog', 'info');
          App.openDispatchModal(repo, workflowId, workflowName);
          return;
        }
      }
    } catch (_) {
      // If we can't fetch inputs, try dispatching anyway
    }

    // No required inputs — quick dispatch
    var defaultBranch = 'main';
    try {
      var branches = await apiFetch('/api/branches/' + encodeURIComponent(parts[0]) + '/' + encodeURIComponent(parts[1]));
      if (Array.isArray(branches) && branches.length > 0) {
        var mainBranch = branches.find(function(b) { return b.name === 'main'; }) ||
                         branches.find(function(b) { return b.name === 'master'; }) ||
                         branches[0];
        if (mainBranch) defaultBranch = mainBranch.name;
      }
    } catch (_) {}

    App.showToast('Running "' + workflowName + '" on ' + defaultBranch + '...', 'info');

    try {
      var body = {
        repo: repo,
        workflow_id: workflowId,
        ref: defaultBranch,
      };
      var data = await apiFetch('/api/workflows/dispatch', {
        method: 'POST',
        body: JSON.stringify(body)
      });
      App.showToast(data.message || 'Workflow dispatched on ' + defaultBranch, 'success');
    } catch (err) {
      App.showToast('Dispatch failed: ' + err.message, 'error');
    }
  },

  /** Open dispatch modal */
  openDispatchModal: async function(repo, workflowId, workflowName) {
    State.dispatchContext = { repo: repo, workflowId: workflowId, workflowName: workflowName, workflowInputs: [] };

    document.getElementById('dispatch-repo').value = repo;
    document.getElementById('dispatch-workflow-name').value = workflowName;

    // Reset branch select
    var branchSelect = document.getElementById('dispatch-branch');
    branchSelect.innerHTML = '<option value="">Loading branches...</option>';

    // Reset inputs
    var inputsList = document.getElementById('dispatch-inputs-list');
    inputsList.innerHTML = '';
    var customSection = document.getElementById('dispatch-custom-inputs');
    customSection.style.display = 'none';
    document.getElementById('dispatch-custom-inputs-list').innerHTML = '';
    var inputsLoading = document.getElementById('dispatch-inputs-loading');
    var noDispatch = document.getElementById('dispatch-no-dispatch');
    inputsLoading.style.display = 'flex';
    noDispatch.style.display = 'none';

    // Enable run button
    var runBtn = document.getElementById('dispatch-run-btn');
    runBtn.disabled = false;
    runBtn.textContent = 'Run Workflow';

    // Show modal
    document.getElementById('dispatch-modal').classList.add('visible');

    var parts = repo.split('/');

    // Fetch branches and inputs concurrently
    var branchesPromise = apiFetch('/api/branches/' + encodeURIComponent(parts[0]) + '/' + encodeURIComponent(parts[1])).catch(function() { return null; });
    var inputsPromise = apiFetch('/api/workflows/' + encodeURIComponent(parts[0]) + '/' + encodeURIComponent(parts[1]) + '/' + workflowId + '/inputs').catch(function() { return null; });

    var results = await Promise.all([branchesPromise, inputsPromise]);
    var branches = results[0];
    var inputsData = results[1];

    // Populate branches
    branchSelect.innerHTML = '';
    if (Array.isArray(branches) && branches.length > 0) {
      branches.forEach(function(b) {
        var opt = document.createElement('option');
        opt.value = b.name;
        opt.textContent = b.name + (b.protected ? ' (protected)' : '');
        branchSelect.appendChild(opt);
      });
      var defaultBranch = branches.find(function(b) { return b.name === 'main'; }) ||
                            branches.find(function(b) { return b.name === 'master'; }) ||
                            branches[0];
      if (defaultBranch) branchSelect.value = defaultBranch.name;
    } else {
      branchSelect.innerHTML = '<option value="main">main</option>';
    }

    // Populate inputs
    inputsLoading.style.display = 'none';

    if (inputsData && !inputsData.has_dispatch) {
      noDispatch.style.display = 'block';
      runBtn.disabled = true;
      return;
    }

    if (inputsData && inputsData.inputs && inputsData.inputs.length > 0) {
      State.dispatchContext.workflowInputs = inputsData.inputs;
      App._renderWorkflowInputs(inputsData.inputs, inputsList);
    } else {
      inputsList.innerHTML = '<div style="font-size:var(--font-size-xs);color:var(--text-muted);padding:4px 0;">No defined inputs for this workflow.</div>';
    }

    // Show custom inputs section
    customSection.style.display = 'block';
  },

  /** Render typed workflow input fields */
  _renderWorkflowInputs: function(inputs, container) {
    var html = '';
    inputs.forEach(function(inp) {
      html += '<div class="wf-input-field" data-input-name="' + esc(inp.name) + '">';
      html += '<div class="wf-input-field-header">';
      html += '<span class="wf-input-name">' + esc(inp.name) + '</span>';
      if (inp.required) html += '<span class="wf-input-required">*required</span>';
      html += '<span class="wf-input-type">(' + esc(inp.type || 'string') + ')</span>';
      html += '</div>';
      if (inp.description) {
        html += '<div class="wf-input-desc">' + esc(inp.description) + '</div>';
      }

      var inputType = inp.type || 'string';
      var defaultVal = inp.default != null ? inp.default : '';

      if (inputType === 'boolean') {
        var checked = defaultVal === 'true' ? ' checked' : '';
        html += '<div class="wf-input-checkbox-wrap">';
        html += '<input type="checkbox" class="wf-input-value" data-input-type="boolean"' + checked + '>';
        html += '<span style="font-size:var(--font-size-xs);color:var(--text-muted);">' + (defaultVal ? 'default: ' + esc(defaultVal) : '') + '</span>';
        html += '</div>';
      } else if (inputType === 'choice' && inp.options && inp.options.length > 0) {
        html += '<select class="form-select wf-input-value" data-input-type="choice">';
        inp.options.forEach(function(opt) {
          var selected = opt === defaultVal ? ' selected' : '';
          html += '<option value="' + esc(opt) + '"' + selected + '>' + esc(opt) + '</option>';
        });
        html += '</select>';
      } else if (inputType === 'number') {
        html += '<input type="number" class="form-input wf-input-value" data-input-type="number" value="' + esc(defaultVal) + '" placeholder="Enter number">';
      } else {
        // string / environment / unknown
        html += '<input type="text" class="form-input wf-input-value" data-input-type="string" value="' + esc(defaultVal) + '" placeholder="Enter value">';
      }

      html += '</div>';
    });
    container.innerHTML = html;
  },

  /** Close dispatch modal */
  closeDispatchModal: function() {
    document.getElementById('dispatch-modal').classList.remove('visible');
    State.dispatchContext = null;
  },

  /** Add custom input key-value pair in dispatch modal */
  addDispatchInput: function() {
    var list = document.getElementById('dispatch-custom-inputs-list');
    var pair = document.createElement('div');
    pair.className = 'input-pair';
    pair.innerHTML = '<input type="text" class="form-input dispatch-input-key" placeholder="key">' +
      '<input type="text" class="form-input dispatch-input-val" placeholder="value">' +
      '<button type="button" class="repo-remove-btn" style="opacity:1" onclick="this.parentElement.remove()">&times;</button>';
    list.appendChild(pair);
    pair.querySelector('.dispatch-input-key').focus();
  },

  /** Dispatch (trigger) a workflow */
  dispatchWorkflow: async function() {
    var ctx = State.dispatchContext;
    if (!ctx) return;

    var branch = document.getElementById('dispatch-branch').value;
    if (!branch) {
      App.showToast('Please select a branch', 'error');
      return;
    }

    // Collect typed workflow inputs
    var inputs = {};
    var hasInputs = false;
    document.querySelectorAll('#dispatch-inputs-list .wf-input-field').forEach(function(field) {
      var name = field.dataset.inputName;
      var el = field.querySelector('.wf-input-value');
      if (!el || !name) return;
      var inputType = el.dataset.inputType;
      var value;
      if (inputType === 'boolean') {
        value = el.checked ? 'true' : 'false';
      } else {
        value = el.value;
      }
      if (value !== '' || (inputType === 'boolean')) {
        inputs[name] = value;
        hasInputs = true;
      }
    });

    // Collect custom key-value inputs
    document.querySelectorAll('#dispatch-custom-inputs-list .input-pair').forEach(function(pair) {
      var key = pair.querySelector('.dispatch-input-key').value.trim();
      var val = pair.querySelector('.dispatch-input-val').value.trim();
      if (key) {
        inputs[key] = val;
        hasInputs = true;
      }
    });

    // Validate required fields
    var missingRequired = [];
    if (ctx.workflowInputs) {
      ctx.workflowInputs.forEach(function(inp) {
        if (inp.required && (!inputs[inp.name] || inputs[inp.name] === '')) {
          missingRequired.push(inp.name);
        }
      });
    }
    if (missingRequired.length > 0) {
      App.showToast('Missing required inputs: ' + missingRequired.join(', '), 'error');
      return;
    }

    var body = {
      repo: ctx.repo,
      workflow_id: ctx.workflowId,
      ref: branch,
    };
    if (hasInputs) body.inputs = inputs;

    var btn = document.getElementById('dispatch-run-btn');
    btn.disabled = true;
    btn.textContent = 'Dispatching...';

    try {
      var data = await apiFetch('/api/workflows/dispatch', {
        method: 'POST',
        body: JSON.stringify(body)
      });
      App.showToast(data.message || 'Workflow dispatched', 'success');
      App.closeDispatchModal();
    } catch (err) {
      App.showToast('Dispatch failed: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Run Workflow';
    }
  },

  /* ═══════════════════════════════════════════════════════════════
     MANUAL REFRESH
     ═══════════════════════════════════════════════════════════════ */

  manualRefresh: async function() {
    var btn = document.getElementById('refresh-btn');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.classList.add('spinning');
    try {
      await apiFetch('/api/refresh', { method: 'POST' });
      App.showToast('Refresh complete', 'success');
    } catch (err) {
      App.showToast('Refresh failed: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.classList.remove('spinning');
    }
  },

  /* ═══════════════════════════════════════════════════════════════
     TOAST NOTIFICATION SYSTEM
     ═══════════════════════════════════════════════════════════════ */

  showToast: function(message, type) {
    type = type || 'info';
    const container = document.getElementById('toast-container');

    const icons = {
      success: '&#10003;',
      error: '&#10007;',
      info: '&#9432;'
    };

    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.innerHTML = '<span class="toast-icon">' + (icons[type] || icons.info) + '</span>' +
      '<span class="toast-message">' + esc(message) + '</span>' +
      '<button class="toast-close" onclick="App.dismissToast(this.parentElement)">&times;</button>';

    container.appendChild(toast);

    // Auto-dismiss after 5 seconds
    setTimeout(function() {
      App.dismissToast(toast);
    }, 5000);
  },

  dismissToast: function(toastEl) {
    if (!toastEl || !toastEl.parentElement) return;
    toastEl.classList.add('toast-out');
    setTimeout(function() {
      if (toastEl.parentElement) toastEl.parentElement.removeChild(toastEl);
    }, 250);
  },

  /* ═══════════════════════════════════════════════════════════════
     SCANLINE TOGGLE
     ═══════════════════════════════════════════════════════════════ */

  toggleScanlines: function() {
    document.getElementById('scanline-overlay').classList.toggle('active');
  }
};

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR RESIZE HANDLER
   ═══════════════════════════════════════════════════════════════ */
(function() {
  const handle = document.getElementById('sidebar-resize');
  const sidebar = document.getElementById('sidebar');
  let isResizing = false;
  let startX = 0;
  let startWidth = 0;

  handle.addEventListener('mousedown', function(e) {
    isResizing = true;
    startX = e.clientX;
    startWidth = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isResizing) return;
    const diff = e.clientX - startX;
    let newWidth = startWidth + diff;
    if (newWidth < 200) newWidth = 200;
    if (newWidth > 480) newWidth = 480;
    sidebar.style.width = newWidth + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (!isResizing) return;
    isResizing = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

/* ═══════════════════════════════════════════════════════════════
   MODAL CLOSE ON BACKDROP CLICK + ESCAPE KEY
   ═══════════════════════════════════════════════════════════════ */
document.getElementById('dispatch-modal').addEventListener('click', function(e) {
  if (e.target === this) App.closeDispatchModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    App.closeDispatchModal();
  }
});

/* ═══════════════════════════════════════════════════════════════
   PERIODIC LAST-POLL UPDATE
   ═══════════════════════════════════════════════════════════════ */
setInterval(function() {
  renderLastPoll();
}, 30000);

/* ═══════════════════════════════════════════════════════════════
   INITIALIZATION
   ═══════════════════════════════════════════════════════════════ */
(function init() {
  // Restore last tab from localStorage
  try {
    const savedTab = localStorage.getItem('gwd_tab');
    if (savedTab && ['active-runs', 'workflows', 'actions', 'history'].indexOf(savedTab) >= 0) {
      App.switchTab(savedTab);
    }
  } catch(_) {}

  // Connect WebSocket
  wsConnect();
})();
</script>
